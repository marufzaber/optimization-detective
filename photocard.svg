<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <style>
      .brand      { font-size: 22px; font-weight: 600; fill: #64748b; letter-spacing: 4px; }
      .hero       { font-size: 220px; font-weight: 800; fill: #f8fafc; letter-spacing: -6px; }
      .hero-unit  { font-size: 100px; font-weight: 700; fill: #22d3ee; }
      .hero-label { font-size: 26px; font-weight: 500; fill: #94a3b8; letter-spacing: 1px; }
      .divider    { stroke: #1e293b; stroke-width: 2; }
      .body-hd    { font-size: 24px; font-weight: 700; fill: #a5f3fc; letter-spacing: 3px; }
      .lib        { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .libdot     { font-size: 34px; font-weight: 400; fill: #334155; }
      .footer-mono{ font-size: 22px; font-weight: 500; fill: #22d3ee; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .footer-sm  { font-size: 16px; font-weight: 400; fill: #64748b; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Brand mark -->
  <text x="600" y="130" text-anchor="middle" class="brand">OPTIMIZATION-DETECTIVE</text>

  <!-- Hero 1: speedup -->
  <text x="600" y="380" text-anchor="middle" class="hero">6.87<tspan class="hero-unit">×</tspan></text>
  <text x="600" y="430" text-anchor="middle" class="hero-label">peak speedup on Abseil's suffix-compare</text>

  <line x1="300" y1="490" x2="900" y2="490" class="divider"/>

  <!-- Hero 2: dollars -->
  <text x="600" y="680" text-anchor="middle" class="hero">$214k</text>
  <text x="600" y="730" text-anchor="middle" class="hero-label">
    per year, at 10 M-core hyperscaler scale  ·  ~1,000 tCO<tspan baseline-shift="sub" font-size="18">2</tspan>e avoided
  </text>

  <line x1="300" y1="790" x2="900" y2="790" class="divider"/>

  <!-- Library row -->
  <text x="600" y="880" text-anchor="middle" class="body-hd">FROM 5 OPTIMIZATIONS IN</text>
  <text x="600" y="950" text-anchor="middle">
    <tspan class="lib">Abseil</tspan><tspan class="libdot">  ·  </tspan><tspan class="lib">nlohmann/json</tspan><tspan class="libdot">  ·  </tspan><tspan class="lib">cpp-httplib</tspan>
  </text>

  <!-- Footer -->
  <text x="600" y="1100" text-anchor="middle" class="footer-mono">github.com/marufzaber/optimization-detective</text>
  <text x="600" y="1140" text-anchor="middle" class="footer-sm">293,000 fuzzed correctness tests  ·  zero regressions</text>
</svg>
